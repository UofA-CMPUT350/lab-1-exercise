name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile
        run: g++ -g -Wall -Wextra -Wconversion -Wsign-conversion -O -std=c++20 main.cpp matrix.cpp
      - name: Run
        run: |
          chmod u+x a.out
          ./a.out
